[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "tabular-timeseries-ml-starter"
version = "0.1.0"
description = "Reusable, leakage-aware regression workflows for tabular and time-series data"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "MIT"}
authors = [{name = "Project Contributors"}]
keywords = ["machine-learning", "data-science", "regression", "time-series", "templates"]
dependencies = [
    "numpy>=1.26,<3",
    "pandas>=2.2,<3",
    "scikit-learn>=1.5,<2",
    "matplotlib>=3.8,<4",
    "PyYAML>=6,<7",
    "joblib>=1.4,<2",
]

[project.optional-dependencies]
boosting = ["xgboost>=2.1,<4"]
notebooks = ["jupyterlab>=4,<5", "seaborn>=0.13,<1", "scipy>=1.12,<2"]
dev = ["pytest>=8,<10", "ruff>=0.6,<1"]
all = ["xgboost>=2.1,<4", "jupyterlab>=4,<5", "seaborn>=0.13,<1", "scipy>=1.12,<2", "pytest>=8,<10", "ruff>=0.6,<1"]

[project.scripts]
ds-starter = "ds_starter.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".git", ".venv", "data", "models", "reports", "notebooks"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
